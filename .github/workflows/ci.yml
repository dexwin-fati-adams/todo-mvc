name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: todo_test_user
          POSTGRES_PASSWORD: todo_test_password
          POSTGRES_DB: todo_test_db
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

      - name: Run migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://todo_test_user:todo_test_password@localhost:5435/todo_test_db

      - run: pnpm test
        env:
          DATABASE_URL: postgres://todo_test_user:todo_test_password@localhost:5435/todo_test_db